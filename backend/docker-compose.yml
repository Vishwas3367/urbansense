services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: urbansense
      POSTGRES_USER: urbansense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - urbansense-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbansense -d urbansense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  urbansense-postgres:
